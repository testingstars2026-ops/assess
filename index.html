<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subject Finder · College Access Program</title>
<meta name="description" content="A 15-minute assessment for Class 9 to 12 students that shows which subjects and degree directions are worth exploring, and why.">
<style>@import url("https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap");
/* CAP Subject Finder · v0.9
   Same design language as the student fairs page and the Options After subject pages.
   Everything is scoped under #capf so it can sit inside any WordPress theme. */

#capf{
  --ground:#B7CCE7; --pale:#DBE6F3;
  --navy:#24325C; --navy-2:#3A4B7D;
  --paper:#FFFFFF; --cream:#F7F4EC; --field:#FAF9F5;
  --ink:#1D2542; --muted:#59637F; --line:#DFE4EE; --line-strong:#B7C2D8;
  --accent:#B4613C; --accent-ink:#8C4424; --accent-soft:#F6E4D9;
  --ok:#2B7651; --ok-soft:#DDEFE5;
  --sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --top:calc(var(--site-header,0px) + var(--wp-admin-bar-offset,0px));
  background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;color-scheme:light;text-align:left;overflow-x:clip;min-height:100vh;position:relative
}
#capf *,#capf *::before,#capf *::after{box-sizing:border-box;margin:0;padding:0}
#capf h1,#capf h2,#capf h3{font-family:var(--sans);font-weight:500;color:var(--navy);line-height:1.15;text-wrap:balance}
#capf ul,#capf ol{list-style:none}
#capf a{color:inherit}
#capf button{background:none;border:0;border-radius:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit;line-height:inherit}
#capf input{font:inherit;color:var(--ink)}
#capf :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
#capf [hidden]{display:none!important}
#capf em.s{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0;font-size:1.12em;line-height:.9}
#capf small{font-weight:500;font-size:.82em;color:var(--muted);text-transform:none;letter-spacing:0}

/* ── top bar ── */
#capf .capf-top{position:sticky;top:var(--top);z-index:20;background:var(--navy);color:#fff}
#capf .capf-top-in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;min-height:56px}
#capf .brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
#capf .brand img{height:26px;width:auto;display:block;filter:brightness(0) invert(1)}
#capf .brand span{font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--pale)}
#capf .prog{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:14px;font-size:12.5px;color:var(--pale)}
#capf .prog b{color:#fff;font-weight:600;margin-left:4px}
#capf #capf-round{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#capf #capf-left{white-space:nowrap;background:var(--accent);color:#fff;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px}
#capf #capf-left:empty{display:none}
#capf .track{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12)}
#capf #capf-bar{height:100%;background:var(--accent);width:0;transition:width .35s ease}

/* ── layout ── */
#capf #capf-main{max-width:1080px;margin:0 auto;padding:36px 20px 72px}
#capf #capf-main:not([data-screen="intro"]):not([data-screen="result"]){max-width:760px}
#capf .eyebrow{font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy)}
#capf .tag{display:inline-flex;align-items:center;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:var(--navy);color:#fff;padding:4px 9px;line-height:1.3}
#capf .tag.acc{background:var(--accent)}
#capf .lede{font-size:17px;color:var(--navy);max-width:60ch;margin-top:14px}
#capf .hint{font-size:13px;color:var(--muted);margin-top:8px}
#capf .f-l{display:block;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin-bottom:10px}
#capf .count{font-size:13px;color:var(--muted);margin-top:14px;font-weight:500}

/* buttons, pills */
#capf .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.07em;background:var(--navy);color:#fff;border:2px solid var(--navy);border-radius:6px;padding:13px 20px;text-decoration:none;line-height:1.2;transition:background .15s,color .15s,transform .15s;text-align:center}
#capf .btn:hover:not(:disabled){background:var(--navy-2);border-color:var(--navy-2)}
#capf .btn:active:not(:disabled){transform:translateY(1px)}
#capf .btn:disabled{opacity:.35;cursor:default}
#capf .btn.outline{background:transparent;color:var(--navy)}
#capf .btn.outline:hover:not(:disabled){background:var(--navy);color:#fff}
#capf .btn.accent{background:var(--accent);border-color:var(--accent)}
#capf .btn.accent:hover:not(:disabled){background:var(--accent-ink);border-color:var(--accent-ink)}
#capf .btn.small{font-size:11.5px;padding:8px 12px;border-width:1.5px}
#capf .link{font-weight:600;font-size:13px;color:var(--navy);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
#capf .link:hover{color:var(--accent)}
#capf .seg{display:flex;flex-wrap:wrap;gap:8px}
#capf .pill{display:inline-flex;align-items:center;font-weight:500;font-size:14px;background:var(--paper);color:var(--navy);border:1.5px solid var(--line-strong);border-radius:6px;padding:9px 13px;line-height:1.3;transition:background .15s,color .15s,border-color .15s;text-align:left}
#capf .pill:hover{border-color:var(--navy)}
#capf .pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* ── intro ── */
#capf .intro{display:grid;gap:28px;align-items:start}
#capf .aud{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:22px}
#capf .aud .for{background:var(--navy);color:#fff;font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px}
#capf .aud .sub{font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
#capf .hero-h{font-weight:400;font-size:clamp(42px,7vw,76px);letter-spacing:-.03em;line-height:1;color:var(--navy)}
#capf .hero-h.sm{font-size:clamp(30px,4.6vw,48px);line-height:1.06}
#capf .hero-ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
#capf .hchips{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px;font-size:13px;color:var(--navy);font-weight:500}
#capf .hchips span::before{content:"";display:inline-block;width:6px;height:6px;background:var(--accent);margin-right:7px;vertical-align:2px}
#capf .note{background:var(--paper);padding:24px 22px;border-top:4px solid var(--accent)}
#capf .note h3{font-size:22px;font-weight:500;letter-spacing:-.01em;margin:14px 0 16px}
#capf .note dl{display:grid;gap:14px}
#capf .note dl div{display:grid;gap:3px;padding-top:13px;border-top:1px solid var(--line)}
#capf .note dt{font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink)}
#capf .note dd{font-size:14.5px;color:var(--ink);line-height:1.5}
@media (min-width:900px){#capf .intro{grid-template-columns:1.1fr .9fr;gap:56px}#capf .intro-l{padding-top:20px}}

/* ── question screens ── */
#capf .q-head{margin-bottom:26px}
#capf .q-h{font-weight:400;font-size:clamp(28px,4.6vw,40px);letter-spacing:-.02em;line-height:1.08;margin-top:10px}
#capf .q-lede{font-size:16px;color:var(--navy);margin-top:10px;max-width:58ch}
#capf .field{background:var(--paper);padding:18px 18px 20px;margin-bottom:12px}
#capf .q-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;position:sticky;bottom:0;padding:12px 0;background:linear-gradient(to top,var(--ground) 70%,rgba(183,204,231,0))}
#capf .q-nav .btn{min-width:120px}

/* class tiles */
#capf .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#capf .tile{border:1.5px solid var(--line-strong);padding:14px;display:grid;gap:2px;background:var(--field);transition:border-color .15s,background .15s}
#capf .tile b{font-family:var(--serif);font-weight:400;font-size:28px;color:var(--navy);line-height:1}
#capf .tile span{font-size:12.5px;color:var(--muted)}
#capf .tile:hover{border-color:var(--navy)}
#capf .tile.on{background:var(--navy);border-color:var(--navy)}
#capf .tile.on b,#capf .tile.on span{color:#fff}
@media (min-width:640px){#capf .tiles{grid-template-columns:repeat(4,1fr)}}

/* school search */
#capf .school{position:relative}
#capf input[type=text],#capf input[type=email]{width:100%;border:1.5px solid var(--line-strong);background:var(--field);padding:12px 13px;font-size:15px;border-radius:4px}
#capf input[type=text]:focus,#capf input[type=email]:focus{border-color:var(--navy);outline:none;background:#fff}
#capf .sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1.5px solid var(--navy);z-index:5;max-height:300px;overflow:auto;box-shadow:0 12px 28px rgba(36,50,92,.18)}
#capf .sugg button{display:block;width:100%;padding:10px 13px;font-size:14px;border-bottom:1px solid var(--line)}
#capf .sugg button:hover,#capf .sugg button:focus{background:var(--pale)}
#capf .sugg .sugg-add{color:var(--accent-ink);font-weight:600;border-bottom:0}
#capf .addschool{margin-top:10px;background:var(--cream);padding:14px}
#capf .addschool p{font-size:13.5px;color:var(--navy);margin-bottom:10px}
#capf .row2{display:grid;gap:8px;margin-bottom:10px}
@media (min-width:560px){#capf .row2{grid-template-columns:2fr 1fr}}
#capf .note-ok{font-size:13.5px;color:var(--ok);margin-top:8px;font-weight:500}

/* slider */
#capf .range{width:100%;accent-color:var(--accent);height:28px}
#capf .range-k{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* reveal */
#capf .reveal{background:var(--navy);color:#fff;padding:34px 26px;margin-top:20px}
#capf .reveal .q-h{color:#fff;margin:16px 0 14px}
#capf .reveal p{color:var(--pale);font-size:16px;max-width:52ch;margin-bottom:8px}
#capf .reveal .btn{margin-top:18px;background:#fff;border-color:#fff;color:var(--navy)}
#capf .reveal .btn:hover{background:var(--pale);border-color:var(--pale)}

/* round 1 · city */
#capf .city{display:grid;grid-template-columns:1fr;gap:8px}
#capf .ccard{position:relative;display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;background:var(--paper);padding:14px 40px 14px 14px;font-size:14.5px;line-height:1.4;color:var(--ink);border:1.5px solid transparent;transition:border-color .15s,background .15s,transform .15s}
#capf .ccard:hover{border-color:var(--navy)}
#capf .ccard .ci{width:38px;height:38px;fill:none;stroke:var(--navy);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;background:var(--pale);padding:5px}
#capf .ccard.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#capf .ccard.on .ci{stroke:#fff;background:var(--navy-2)}
#capf .ccard i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-family:var(--serif);font-size:26px;color:#F2B898}
@media (min-width:640px){#capf .city{grid-template-columns:1fr 1fr}}

/* round 2 · pairs */
#capf .pair{display:grid;gap:10px;align-items:stretch}
#capf .popt{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--paper);padding:22px 20px;font-size:17px;font-weight:500;color:var(--navy);line-height:1.35;border:2px solid transparent;min-height:96px;transition:border-color .12s,transform .12s,background .12s;animation:capf-in .25s ease both}
#capf .popt:hover{border-color:var(--navy)}
#capf .popt:active{transform:scale(.99);background:var(--navy);color:#fff}
#capf .popt+.or+.popt{animation-delay:.05s}
#capf .k{display:inline-grid;place-items:center;width:28px;height:28px;border:1.5px solid var(--line-strong);font-size:12px;font-weight:700;color:var(--muted);border-radius:4px;flex-shrink:0}
#capf .or{text-align:center;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--navy);line-height:1}
#capf .pair-foot{display:flex;justify-content:space-between;margin-top:14px}
#capf .dots{display:flex;gap:4px;margin-top:22px;flex-wrap:wrap}
#capf .dots i{width:calc((100% - 92px)/24);min-width:6px;height:4px;background:rgba(36,50,92,.18)}
#capf .dots i.on{background:var(--navy)}
@media (min-width:700px){#capf .pair{grid-template-columns:1fr auto 1fr}#capf .popt{min-height:150px;grid-template-columns:1fr;align-content:space-between}}
@keyframes capf-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#capf *{animation:none!important;transition:none!important}}

/* round 3 · grid */
#capf .tray{display:flex;flex-wrap:wrap;gap:6px;background:var(--paper);padding:12px;min-height:56px;margin-bottom:12px;position:sticky;top:calc(var(--top) + 56px);z-index:4;box-shadow:0 6px 14px rgba(36,50,92,.08)}
#capf .tray-done{font-size:13px;color:var(--muted);align-self:center}
#capf .chip{display:inline-flex;align-items:center;font-size:13px;font-weight:600;background:var(--navy);color:#fff;padding:7px 10px;border-radius:4px;touch-action:none;user-select:none;-webkit-user-select:none;line-height:1.2;transition:transform .1s,box-shadow .1s}
#capf .chip.sel{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);transform:translateY(-1px)}
#capf .chip.lifting{opacity:.35}
#capf .chip.ghost{position:fixed;z-index:50;transform:translate(-50%,-60%) rotate(-2deg);box-shadow:0 10px 24px rgba(0,0,0,.25);background:var(--accent)}
#capf .gridwrap{display:grid;grid-template-columns:22px 1fr;grid-template-areas:"y g" ". x" ". xt";column-gap:6px}
#capf .g-ylab{grid-area:y;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);text-align:center}
#capf .grid9{grid-area:g;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
#capf .cell{background:rgba(255,255,255,.55);min-height:92px;padding:6px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;border:1.5px dashed transparent;transition:background .12s,border-color .12s;cursor:pointer;position:relative}
#capf .cell.sweet{background:var(--paper)}
#capf .cell.sweet::after{content:"Sweet spot";position:absolute;right:6px;bottom:4px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
#capf .cell.hover,#capf .skipzone.hover{border-color:var(--accent);background:var(--accent-soft)}
#capf .cell-l{width:100%;font-size:10.5px;color:var(--muted);line-height:1.1}
#capf .cell-l b{font-weight:600}
#capf .cell-l:empty{display:none}
#capf .cell .chip{font-size:11.5px;padding:5px 7px}
#capf .g-xlab{grid-area:x;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px;font-size:11.5px;font-weight:600;color:var(--navy);text-align:center}
#capf .g-xt{grid-area:xt;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);text-align:center;margin-top:2px}
#capf .skipzone{margin-top:12px;background:rgba(255,255,255,.4);border:1.5px dashed var(--line-strong);padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;cursor:pointer;min-height:48px}
#capf .skipzone>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
#capf .skipzone .chip{background:var(--muted)}
#capf .chips .pill{font-size:14px}
@media (min-width:700px){#capf .cell{min-height:110px}#capf .cell-l{font-size:11.5px}}

/* round 4 · values */
#capf .vals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#capf .vcard{position:relative;background:var(--paper);padding:16px 14px 16px 14px;font-size:14.5px;font-weight:500;color:var(--navy);line-height:1.35;border:1.5px solid transparent;min-height:72px;text-align:left}
#capf .vcard:hover{border-color:var(--navy)}
#capf .vcard i{font-style:normal;font-family:var(--serif);font-size:22px;line-height:1;margin-right:8px;color:#F2B898}
#capf .vcard.top{background:var(--navy);color:#fff}
#capf .vcard.least{background:var(--cream);color:var(--muted);border-color:var(--line-strong);text-decoration:line-through;text-decoration-color:var(--accent)}
#capf .vcard.least i{color:var(--accent)}
@media (min-width:640px){#capf .vals{grid-template-columns:repeat(3,1fr)}}

/* round 5 · puzzles */
#capf .puzzle{background:var(--paper);padding:22px 18px}
#capf .pz-q{font-size:18px;font-weight:500;color:var(--navy);margin:12px 0 16px;line-height:1.4}
#capf .pz-fig{background:var(--field);padding:16px;display:flex;justify-content:center;margin-bottom:14px}
#capf .pz-draw{width:100%;max-width:320px;height:auto}
#capf .pz-fig .pz-shape{width:auto;height:72px}
#capf .pz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
#capf .pz-o{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line-strong);padding:12px;font-size:15px;color:var(--ink);background:#fff;min-height:56px;transition:border-color .12s,background .12s}
#capf .pz-o:hover{border-color:var(--navy);background:var(--field)}
#capf .pz-opts.visual .pz-o{flex-direction:column;justify-content:center;gap:8px;min-height:110px}
#capf .pz-opts.visual .pz-o .k{align-self:flex-start}
#capf .pz-opts.visual .pz-shape{height:58px;width:auto;max-width:100%}
#capf .pz-opts.visual span:not(.k){font-size:13px;font-weight:500;color:var(--navy)}
#capf .pz-shape rect{fill:var(--navy);stroke:#fff;stroke-width:1.5}
#capf .pz-paper{fill:#fff;stroke:var(--navy);stroke-width:1.6}
#capf .pz-shape .pz-paper{fill:#fff}
#capf .pz-shape rect.pz-paper{fill:#fff;stroke:var(--navy);stroke-width:1.6}
#capf .pz-fold{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
#capf .pz-arrow{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#capf .pz-hole{fill:var(--navy)}
#capf .pz-cap{font-size:9px;fill:var(--muted);font-family:var(--sans)}
#capf .pz-line{fill:none;stroke:var(--navy);stroke-width:1.6}
#capf .pz-slicefill{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.8}
#capf .cb-top{fill:#fff;stroke:var(--navy);stroke-width:1.2;stroke-linejoin:round}
#capf .cb-left{fill:var(--pale);stroke:var(--navy);stroke-width:1.2;stroke-linejoin:round}
#capf .cb-right{fill:#9FB6D6;stroke:var(--navy);stroke-width:1.2;stroke-linejoin:round}
@media (min-width:640px){#capf .pz-opts{grid-template-columns:repeat(4,1fr)}#capf .pz-opts:not(.visual){grid-template-columns:1fr 1fr}}

/* round 6 */
#capf .mrow{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
#capf .mrow:first-of-type{border-top:0;padding-top:0}
#capf .mrow>span{font-size:13.5px;font-weight:600;color:var(--navy)}
#capf .mrow .pill{font-size:13px;padding:7px 10px}
@media (min-width:640px){#capf .mrow{grid-template-columns:130px 1fr;align-items:center}}

/* ── results ── */
#capf .res-hero{display:grid;gap:24px;margin-bottom:36px}
#capf .res-hero .tag{margin-bottom:16px}
#capf .cert{background:var(--paper);padding:18px;align-self:end}
#capf .cert-line{position:relative;height:10px;background:linear-gradient(90deg,var(--pale),var(--navy));margin:14px 6px 8px}
#capf .cert-line i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#capf .cert-line i.b{background:var(--muted)}
#capf .cert-line i.a{background:var(--accent)}
#capf .dotb,#capf .dota{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px}
#capf .dotb{background:var(--muted)}#capf .dota{background:var(--accent)}
@media (min-width:900px){#capf .res-hero{grid-template-columns:1.6fr 1fr;gap:40px}}
#capf .band-in{margin-top:44px}
#capf .sec-h{font-weight:400;font-size:clamp(26px,3.6vw,36px);letter-spacing:-.02em;margin-bottom:16px}
#capf .top3{display:grid;gap:10px}
@media (min-width:860px){#capf .top3{grid-template-columns:repeat(3,1fr)}}
#capf .mcard,#capf .dcard{background:var(--paper);padding:20px;display:flex;flex-direction:column;gap:10px}
#capf .mcard:first-child,#capf .dcard:first-child{border-top:4px solid var(--accent)}
#capf .m-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#capf .m-n{font-family:var(--serif);font-size:30px;color:var(--accent);line-height:1}
#capf .m-pct{font-family:var(--serif);font-size:38px;color:var(--navy);line-height:1}
#capf .m-pct small{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:4px}
#capf .mcard h3,#capf .dcard h3{font-size:23px;letter-spacing:-.01em}
#capf .m-line{font-size:14px;color:var(--muted)}
#capf .m-why{display:grid;gap:6px;flex:1}
#capf .m-why li{font-size:14px;line-height:1.45;padding-left:14px;position:relative}
#capf .m-why li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--accent)}
#capf .m-flag{font-size:13px;background:var(--accent-soft);color:var(--accent-ink);padding:9px 11px;line-height:1.45}
#capf .mcard .btn,#capf .dcard .btn{align-self:flex-start;margin-top:4px}
#capf .wild{margin-top:10px;background:var(--cream);padding:20px;display:grid;gap:8px;justify-items:start}
#capf .wild h3{font-size:22px}
#capf .wild h3 small{font-size:13px;font-weight:600;margin-left:6px}
#capf .wild p{font-size:14.5px;max-width:70ch}
#capf .combos{display:grid;gap:10px;margin-top:16px}
@media (min-width:820px){#capf .combos{grid-template-columns:1fr 1fr}}
#capf .combo{background:var(--paper);padding:20px;display:grid;gap:12px;align-content:start}
#capf .c-line{font-size:14px;color:var(--muted)}
#capf .c-subj{display:flex;flex-wrap:wrap;gap:6px}
#capf .c-subj li{background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:6px 10px}
#capf .c-subj li:first-child{background:var(--pale);color:var(--navy)}
#capf .ledger{display:grid;gap:2px;margin-top:4px}
#capf .lg{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;font-size:13.5px;padding:7px 0;border-top:1px solid var(--line)}
#capf .lg i{width:10px;height:10px}
#capf .lg b{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
#capf .lg.open i{background:var(--ok)}#capf .lg.open b{color:var(--ok)}
#capf .lg.flag i{background:var(--accent)}#capf .lg.flag b{color:var(--accent-ink)}
#capf .lg.closed i{background:var(--line-strong)}#capf .lg.closed{color:var(--muted)}#capf .lg.closed b{color:var(--muted)}
#capf .st{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 7px;text-align:right}
#capf .st.open{background:var(--ok-soft);color:var(--ok)}
#capf .st.flag{background:var(--accent-soft);color:var(--accent-ink)}
#capf .st.closed{background:var(--line);color:var(--muted)}
#capf .d-dl{display:grid;gap:8px;flex:1}
#capf .d-dl div{border-top:1px solid var(--line);padding-top:7px}
#capf .d-dl dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#capf .d-dl dd{font-size:14px}
#capf .d-links{display:grid;gap:6px}
#capf .family{background:var(--navy);color:#fff;padding:20px;display:grid;gap:10px;justify-items:start}
#capf .family .tag{background:var(--accent)}
#capf .family p{color:var(--pale);font-size:15.5px;max-width:70ch}
#capf .shape-g{display:grid;gap:14px}
#capf .shape-g>div{background:var(--paper);padding:20px}
#capf .shape-hex{display:grid;gap:12px;justify-items:center;text-align:center}
#capf .shape-hex p{font-size:14.5px;max-width:42ch}
#capf .hex{width:100%;max-width:300px;height:auto}
#capf .h-ring{fill:none;stroke:var(--line-strong);stroke-width:1}
#capf .h-shape{fill:rgba(180,97,60,.22);stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
#capf .h-l{font-family:var(--sans);font-size:11px;font-weight:600;fill:var(--navy)}
#capf .dbars{display:grid;gap:9px;margin-bottom:18px}
#capf .db{display:grid;grid-template-columns:1fr;gap:4px;font-size:13.5px}
#capf .db i{display:block;height:8px;background:var(--pale)}
#capf .db b{display:block;height:100%;background:var(--accent)}
#capf .mini{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px}
#capf .mini p{font-size:14px}
#capf .mini .f-l{margin-bottom:3px;color:var(--muted)}
@media (min-width:860px){#capf .shape-g{grid-template-columns:1fr 1.2fr}#capf .db{grid-template-columns:200px 1fr;align-items:center}}
#capf .report{display:grid;gap:10px}
#capf .rep-l,#capf .rep-r{background:var(--paper);padding:22px;display:grid;gap:10px;align-content:start}
#capf .rep-l{background:var(--navy);color:#fff}
#capf .rep-l .sec-h{color:#fff;margin-bottom:0}
#capf .rep-l .q-lede{color:var(--pale);margin-top:0}
#capf .rep-l .f-l{color:var(--pale);margin:8px 0 0}
#capf .rep-l .f-l small{color:var(--pale);opacity:.8}
#capf .rep-l input{background:#fff}
#capf .rep-l .btn{justify-self:start;margin-top:6px}
#capf .rep-r h3{font-size:20px}
#capf .rep-r .btn{justify-self:start}
#capf .consent{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:13px;line-height:1.45;color:var(--ink);align-items:start}
#capf .consent input{width:18px;height:18px;margin-top:1px;accent-color:var(--navy)}
@media (min-width:860px){#capf .report{grid-template-columns:1.1fr 1fr}}
#capf .nextsteps{background:var(--paper);padding:22px}
#capf .nextsteps ol{display:grid;gap:12px;counter-reset:n;margin-bottom:18px}
#capf .nextsteps li{counter-increment:n;display:grid;grid-template-columns:34px 1fr;font-size:15px;line-height:1.45}
#capf .nextsteps li::before{content:counter(n);font-family:var(--serif);font-size:28px;color:var(--accent);line-height:1}
#capf .nextsteps a{font-weight:600;color:var(--navy);text-underline-offset:3px}

/* footer */
#capf .capf-foot{max-width:1080px;margin:0 auto;padding:0 20px 40px;font-size:12.5px;color:var(--navy);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
@media print{#capf .capf-top,#capf .q-nav{display:none}}
@media (max-width:560px){#capf .brand span{display:none}#capf .prog{font-size:12px;gap:8px}}
#capf .nextsteps li>span{min-width:0}

/* ═════════ scoring ═════════ */
function domainScores(){
  const keys=Object.keys(D.DOMAINS),chosen={},exp={},city={};keys.forEach(k=>{chosen[k]=0;exp[k]=0;city[k]=0});
  S.city.forEach(id=>{const c=D.CITY.find(x=>x.id===id);if(c)c.d.forEach(d=>city[d]+=1)});
  S.pairs.forEach((p,i)=>{if(!p)return;const pair=D.PAIRS[p.i];pair.forEach((opt,side)=>{opt[2].forEach(d=>{exp[d]+=1;const w=p.c===2?.5:(p.c===side?1:0);chosen[d]+=w})})});
  const raw={};keys.forEach(k=>{const ps=exp[k]?chosen[k]/exp[k]:0;const cs=Math.min(1,city[k]/2);raw[k]=100*(0.72*ps+0.28*cs)});
  const vals=keys.map(k=>raw[k]),mn=Math.min(...vals),mx=Math.max(...vals);
  const norm={};keys.forEach(k=>{norm[k]=mx>mn?(raw[k]-mn)/(mx-mn)*100:50});
  return {raw,norm};
}
function selfBelief(){
  const out={};
  if(S.band==='junior'){
    const val={};Object.entries(S.grid).forEach(([k,g])=>{if(g&&g.g!=null)val[k]=((g.g+g.e)/4)*100+(S.useful.includes(k)?10:0)});
    D.SUBJECTS.forEach(s=>{let a=0,w=0;Object.entries(s.proxy).forEach(([k,pw])=>{if(val[k]!=null){a+=val[k]*pw;w+=pw}});out[s.id]=w?clamp(a/w,0,100):null});
  }else{
    const acc={},wt={};
    S.current.forEach(id=>{const g=S.grid[id];const ss=D.SENIOR_SUBJECTS.find(x=>x.id===id);if(!ss||!g||g.g==null)return;const v=((g.g+g.e)/4)*100;Object.entries(ss.m).forEach(([sid,mw])=>{acc[sid]=(acc[sid]||0)+v*mw;wt[sid]=(wt[sid]||0)+mw})});
    S.wish.forEach(id=>{const ss=D.SENIOR_SUBJECTS.find(x=>x.id===id);if(!ss)return;Object.entries(ss.m).forEach(([sid,mw])=>{acc[sid]=(acc[sid]||0)+75*mw*.7;wt[sid]=(wt[sid]||0)+mw*.7})});
    D.SUBJECTS.forEach(s=>{out[s.id]=wt[s.id]?clamp(acc[s.id]/wt[s.id],0,100):null});
  }
  return out;
}
function tiltScores(){
  const k={n:{c:0,ms:0,t:0},w:{c:0,ms:0,t:0},s:{c:0,ms:0,t:0}};
  S.puzzles.forEach(p=>{if(!p)return;const x=k[p.k];x.t++;if(p.ok){x.c++;x.ms+=p.ms}});
  const raw={};Object.entries(k).forEach(([kk,x])=>{const acc=x.t?x.c/x.t:0;const sp=x.c?1-Math.min(1,(x.ms/x.c)/60000):0;raw[kk]=acc+sp*0.08});
  const v=Object.values(raw),mn=Math.min(...v),mx=Math.max(...v);const norm={};Object.keys(raw).forEach(kk=>{norm[kk]=mx>mn?(raw[kk]-mn)/(mx-mn)*100:50});
  const order=Object.keys(raw).sort((a,b)=>raw[b]-raw[a]);
  return {raw,norm,order,acc:Object.fromEntries(Object.entries(k).map(([kk,x])=>[kk,x.c]))};
}
function compute(){
  const dom=domainScores(),sb=selfBelief(),tl=tiltScores();
  const topVals=S.values.top,least=S.values.least;
  const subj=D.SUBJECTS.map(s=>{
    let I=0,w=0;Object.entries(s.dom).forEach(([d,dw])=>{I+=dom.norm[d]*dw;w+=dw});I=w?I/w:0;
    const Sb=sb[s.id];
    let T=0;Object.entries(s.tilt).forEach(([kk,tw])=>T+=tl.norm[kk]*tw);
    const mt=s.val.filter(v=>topVals.includes(v)).length,ml=s.val.includes(least)?1:0;const V=clamp(30+35*mt-30*ml,0,100);
    const pm=s.prob.filter(p=>S.problems.includes(p)).length;const P=clamp(25+40*pm,0,100);
    const parts=[[.40,I],[.25,Sb],[.15,T],[.10,V],[.10,P]].filter(x=>x[1]!=null);const tw=parts.reduce((a,x)=>a+x[0],0);
    const M=parts.reduce((a,x)=>a+x[0]*x[1],0)/tw;
    return {id:s.id,s,I,S:Sb,T,V,P,M};
  }).sort((a,b)=>b.M-a.M);
  subj.forEach((x,i)=>x.rank=i+1);
  const byId=Object.fromEntries(subj.map(x=>[x.id,x]));
  /* Holland */
  const H={R:0,I:0,A:0,S:0,E:0,C:0},HW={R:0,I:0,A:0,S:0,E:0,C:0};
  Object.entries(D.DOMAINS).forEach(([d,def])=>Object.entries(def.h).forEach(([t,w])=>{H[t]+=dom.norm[d]*w;HW[t]+=w}));
  Object.keys(H).forEach(t=>H[t]=HW[t]?H[t]/HW[t]:0);
  /* confidence */
  const gap=subj[0].M-subj[3].M;let conf=0;if(gap>=12)conf+=2;else if(gap>=6)conf+=1;
  if(subj[0].S!=null&&subj[0].S>=60)conf+=1;
  const cant=S.pairs.filter(p=>p&&p.c===2).length,sideA=S.pairs.filter(p=>p&&p.c===0).length,sideB=S.pairs.filter(p=>p&&p.c===1).length;
  const times=S.pairs.filter(p=>p).map(p=>p.ms).sort((a,b)=>a-b);const med=times.length?times[Math.floor(times.length/2)]:9999;
  const flags=[];if(cant>=8){conf-=1;flags.push('many_cant_choose')}if(Math.max(sideA,sideB)>=20){conf-=2;flags.push('same_side')}if(med<1500){conf-=1;flags.push('very_fast')}
  const confidence=conf>=3?'high':conf>=1?'medium':'low';
  /* clusters (Class 11–12), combinations (Class 9–10) */
  const clusters=D.CLUSTERS.map(c=>{let a=0,w=0;Object.entries(c.w).forEach(([sid,cw])=>{a+=byId[sid].M*cw;w+=cw});let sc=a/w;
    const ls=(S.next.learn||[]);sc+=Math.min(12,6*c.learn.filter(l=>ls.includes(l)).length);
    if(c.inter){sc+=S.next.combine==='yes'?8:S.next.combine==='no'?-6:2}
    return {id:c.id,c,score:sc}}).sort((a,b)=>b.score-a.score);
  clusters.forEach((x,i)=>x.rank=i+1);
  return {dom,sb,tl,subj,byId,H,confidence,flags,clusters};
}

function hasSet(){const set=new Set();S.current.forEach(id=>{const ss=D.SENIOR_SUBJECTS.find(x=>x.id===id);if(!ss)return;Object.entries(ss.m).forEach(([sid,w])=>{if(w>=.8)set.add(sid)})});return set}
function status(cluster,set){const c=cluster;if(c.req.some(r=>!set.has(r)))return 'closed';if((c.flag||[]).some(r=>!set.has(r)))return 'flag';if(c.flagAny&&!c.flagAny.some(r=>set.has(r)))return 'flag';return 'open'}

function combos(R){
  const opts=D.SUBJECTS.filter(s=>s.c11&&s.id!=='english').map(s=>s.id);const out=[];
  for(let a=0;a<opts.length;a++)for(let b=a+1;b<opts.length;b++)for(let c=b+1;c<opts.length;c++)for(let d=c+1;d<opts.length;d++){
    const set=[opts[a],opts[b],opts[c],opts[d]],has=x=>set.includes(x);
    if(has('physics')&&!has('chemistry'))continue;if(has('chemistry')&&!(has('physics')||has('biology')))continue;
    if(has('computer-science')&&!has('mathematics')&&R.byId['computer-science'].rank>6)continue;
    const avg=set.reduce((x,s)=>x+R.byId[s].M,0)/4;
    const st=new Set(set.concat(['english']));let open=0,tot=0;
    R.clusters.forEach(cl=>{const v=status(cl.c,st);tot+=cl.score;open+=cl.score*(v==='open'?1:v==='flag'?.5:0)});
    out.push({set,avg,openness:open/tot*100});
  }
  out.sort((x,y)=>y.avg-x.avg);const best=out[0];
  const keep=out.filter(o=>o.set.join()!==best.set.join()&&o.set.filter(s=>R.byId[s].rank<=6).length>=2).map(o=>Object.assign(o,{k:.5*o.openness+.5*o.avg})).sort((x,y)=>y.k-x.k)[0]||out[1];
  return {best,keep};
}

function because(sid){
  const s=SUB[sid],items=[];
  S.city.forEach(id=>{const c=D.CITY.find(x=>x.id===id);const w=c.d.reduce((a,d)=>a+(s.dom[d]||0),0);if(w>0)items.push({w:w+.05,v:'picked',t:c.s})});

function hex(H){const order=['R','I','A','S','E','C'],cx=120,cy=112,r=84;
  const pt=(i,v)=>{const a=-Math.PI/2+i*Math.PI/3;return [cx+Math.cos(a)*r*v,cy+Math.sin(a)*r*v]};
  const ring=v=>order.map((_,i)=>pt(i,v).map(n=>n.toFixed(1)).join(',')).join(' ');
  const shape=order.map((t,i)=>pt(i,Math.max(.06,H[t]/100)).map(n=>n.toFixed(1)).join(',')).join(' ');
  return '<svg viewBox="0 0 240 228" class="hex" role="img" aria-label="Your interest shape across six types">'+[1,.66,.33].map(v=>'<polygon points="'+ring(v)+'" class="h-ring"/>').join('')+'<polygon points="'+shape+'" class="h-shape"/>'+
  order.map((t,i)=>{const p=pt(i,1.22);return '<text x="'+p[0].toFixed(0)+'" y="'+(p[1]+4).toFixed(0)+'" text-anchor="middle" class="h-l">'+D.HOLLAND[t].name+'</text>'}).join('')+'</svg>'}

  if(act==='pdf'){const b=t;b.disabled=true;b.textContent='Preparing…';const nm=($('#capf-name').value||'').trim().slice(0,40);
    loadJsPDF().then(()=>{buildPDF(nm);b.textContent='Downloaded ✓';track('report_downloaded',{band:S.band,confidence:R.confidence})}).catch(()=>{b.textContent='Download failed. Try again.'}).finally(()=>setTimeout(()=>{b.disabled=false;b.textContent='Download my report · PDF'},2500));return}
  if(act==='email'){const em=$('#capf-email').value.trim(),ok=$('#capf-consent').checked,msg=$('#capf-email-msg');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){msg.textContent='Please check the email address.';return}
    if(!ok){msg.textContent='Please tick the consent box first.';return}
    track('report_email_requested',{band:S.band});
    if(!CFG.submitEndpoint){msg.textContent='Preview mode: email sending is switched on when this goes live on the CAP website.';return}
    msg.textContent='Sending…';post(CFG.submitEndpoint,{type:'email_report',id:S.id,email:em,consent:true,result:payload()}).then(r=>{msg.textContent=r?'Sent. Check your inbox in a few minutes.':'We couldn’t send it just now. Please download the PDF instead.'});return}
  /* round-specific */
  const scr=S.screen;
  if(scr==='r0'){
    if(t.dataset.cls){S.cls=+t.dataset.cls;S.band=S.cls<=10?'junior':'senior';save();render();return}
    if(t.dataset.board){S.board=t.dataset.board;save();render();return}
    if(t.dataset.exp){const v=t.dataset.exp;if(v==='nothing')S.explored=S.explored.includes(v)?[]:['nothing'];else{S.explored=S.explored.filter(x=>x!=='nothing');S.explored=S.explored.includes(v)?S.explored.filter(x=>x!==v):S.explored.concat(v)}save();render();return}
  }
  if(scr==='r1'&&t.dataset.city){const id=t.dataset.city;if(S.city.includes(id))S.city=S.city.filter(x=>x!==id);else if(S.city.length<3)S.city=S.city.concat(id);save();render();return}
  if(scr==='r2'){
    if(t.dataset.side!=null&&S.step<24){const i=S.pairOrder[S.step];S.pairs[S.step]={i,c:+t.dataset.side,ms:Math.round(performance.now()-(S._t0||performance.now()))};S.step++;save();render();return}
    if(act==='undo'&&S.step>0){S.step--;S.pairs[S.step]=null;save();render();return}
  }
  if(scr==='r3'){
    if(t.dataset.cur){const v=t.dataset.cur;S.current=S.current.includes(v)?S.current.filter(x=>x!==v):S.current.concat(v);save();render();return}
    if(t.dataset.use){const v=t.dataset.use;if(S.useful.includes(v))S.useful=S.useful.filter(x=>x!==v);else if(S.useful.length<3)S.useful=S.useful.concat(v);save();render();return}
    if(t.dataset.wish){const v=t.dataset.wish;if(S.wish.includes(v))S.wish=S.wish.filter(x=>x!==v);else if(S.wish.length<2)S.wish=S.wish.concat(v);save();render();return}
  }
  if(scr==='r4'){
    if(t.dataset.val){const v=t.dataset.val,tp=S.values.top;if(tp.includes(v)){S.values.top=tp.filter(x=>x!==v);S.values.least=null}else if(tp.length<3)S.values.top=tp.concat(v);else S.values.least=S.values.least===v?null:v;save();render();return}
    if(t.dataset.prob){const v=t.dataset.prob;if(S.problems.includes(v))S.problems=S.problems.filter(x=>x!==v);else if(S.problems.length<3)S.problems=S.problems.concat(v);save();render();return}
  }
  if(scr==='r5'&&t.dataset.pz!=null){const list=PUZZLES[S.band],p=list[S.step],k=+t.dataset.pz;S.puzzles[S.step]={k:p.k,ok:k===p.a,ms:Math.round(performance.now()-(S._t0||performance.now())),skip:k<0};S.step++;save();render();return}
  if(scr==='r6'&&t.dataset.nx){const key=t.dataset.nx,v=t.dataset.v;if(t.dataset.multi){const arr=S.next[key]||[];S.next[key]=arr.includes(v)?arr.filter(x=>x!==v):(key==='learn'&&arr.length>=2?arr.slice(1):arr).concat(v)}else S.next[key]=S.next[key]===v?null:v;save();render();return}
  if(act==='next')return next();
  if(act==='back')return back();
});
function next(){
  const s=S.screen;
  if(s==='intro')return go('r0');
  if(s==='r0'){if(!S.cls)return;track('round_completed',{round:0,band:S.band,board:S.board});return go('r1')}
  if(s==='r1'){if(S.sub==='reveal')return go('r2');if(S.city.length!==3)return;S.sub='reveal';save();track('round_completed',{round:1,picks:S.city.join(',')});return render()}
  if(s==='r2'){track('round_completed',{round:2,cant_choose:S.pairs.filter(p=>p&&p.c===2).length});return go('r3')}
  if(s==='r3'){
    const order=S.band==='senior'?['current','grid','wish','reveal']:['grid','useful','reveal'];const i=order.indexOf(S.sub||order[0]);
    if(S.sub==='reveal')return go('r4');
    if(order[i+1]==='reveal')track('round_completed',{round:3});
    S.sub=order[i+1];S._sel=null;save();return render()}
  if(s==='r4'){if(S.sub==='values'||!S.sub){S.sub='problems';save();return render()}track('round_completed',{round:4});return go('r5')}
  if(s==='r5'){track('round_completed',{round:5,correct:S.puzzles.filter(p=>p&&p.ok).length});return go('r6')}
  if(s==='r6'){track('round_completed',{round:6});return go('close')}
  if(s==='close'){S.doneAt=new Date().toISOString();go('result');
    const p=payload();post(CFG.submitEndpoint,p);
    track('finder_completed',{band:S.band,class:S.cls,board:S.board,school:S.school&&S.school.name||null,school_added:!!(S.school&&S.school.added),top:p.top_subjects.map(x=>x.id).join(','),directions:p.top_directions?p.top_directions.join(','):null,confidence:p.confidence,certainty_before:S.c0,certainty_after:S.c1});return}
}
function back(){
  const s=S.screen;
  if(s==='r3'){const order=S.band==='senior'?['current','grid','wish','reveal']:['grid','useful','reveal'];const i=order.indexOf(S.sub);if(i>0){S.sub=order[i-1];save();return render()}return go('r2')}
  if(s==='r4'&&S.sub==='problems'){S.sub='values';save();return render()}
  const prev={r0:'intro',r1:'r0',r2:'r1',r4:'r3',r5:'r4',r6:'r5',close:'r6'}[s];if(!prev)return;
  S.screen=prev;S.sub=null;S.step=prev==='r2'?24:prev==='r5'?PUZZLES[S.band].length:0;save();render();
}
/* keyboard for pairs and puzzles */
document.addEventListener('keydown',e=>{if(e.target&&/input|textarea/i.test(e.target.tagName))return;
  if(S.screen==='r2'&&S.step<24){if(e.key==='1'||e.key.toLowerCase()==='a'||e.key==='ArrowLeft'){const b=$('.popt[data-side="0"]');b&&b.click()}if(e.key==='2'||e.key.toLowerCase()==='b'||e.key==='ArrowRight'){const b=$('.popt[data-side="1"]');b&&b.click()}}});
/* school link: ?school=Name pre-fills */
function preSchool(){try{const q=new URLSearchParams(location.search).get('school');return q?{name:q.slice(0,120),listed:true,fromLink:true}:null}catch(e){return null}}
render();
})();
</script>
